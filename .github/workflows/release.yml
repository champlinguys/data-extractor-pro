name: Release

# Build prebuilt binaries and attach them to a GitHub Release whenever a
# version tag (e.g. v0.1.0) is pushed. Users can then download and run the
# AppImage without building anything.
#
# The manual trigger is the fallback for when a tag push does not create a run
# (it silently failed to for v0.4.0, leaving the README pointing at download
# URLs that 404). Pass an existing tag:
#   gh workflow run release.yml --ref main -f tag=v0.4.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.4.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # On a manual run, build the tag that was asked for. On a tag push the
      # input is empty and checkout falls back to the triggering ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install build + packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qtbase5-dev libssl-dev \
                                  libfuse2 wget file

      - name: Build (Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          cp build/data-extractor AppDir/usr/bin/
          cp build/de-cli         AppDir/usr/bin/
          cp packaging/data-extractor-pro.desktop \
             AppDir/usr/share/applications/
          cp packaging/data-extractor-pro.svg \
             AppDir/usr/share/icons/hicolor/scalable/apps/

      - name: Build AppImage
        env:
          QMAKE: /usr/bin/qmake
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir --plugin qt --output appimage \
            --desktop-file packaging/data-extractor-pro.desktop \
            --icon-file packaging/data-extractor-pro.svg
          mv Data_Extractor_Pro*.AppImage DataExtractorPro-x86_64.AppImage \
            || mv Data*.AppImage DataExtractorPro-x86_64.AppImage

      - name: Package CLI
        run: tar czf de-cli-linux-x86_64.tar.gz -C build de-cli

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # github.ref_name is the tag on a push, but the branch on a manual
          # run - so the release would be cut against 'main' without this.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            DataExtractorPro-x86_64.AppImage
            de-cli-linux-x86_64.tar.gz
          body: |
            Prebuilt binaries for Linux x86_64.

            - **DataExtractorPro-x86_64.AppImage** - the GUI. Download, then:
              `chmod +x DataExtractorPro-x86_64.AppImage && ./DataExtractorPro-x86_64.AppImage`
              (Qt and OpenSSL are bundled; no dependencies to install.)
            - **de-cli-linux-x86_64.tar.gz** - the headless command-line tool.

            See RECOVERY.md for the full imaging-to-export walkthrough.
